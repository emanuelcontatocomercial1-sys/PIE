<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Eleitoral Bahia — Talita Oliveira 2022</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; color: #111; }

  #header {
    background: #fff;
    border-bottom: 2px solid #C9922A;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  #header h1 { font-size: 20px; font-weight: 700; color: #C9922A; }
  #header p { font-size: 13px; color: #666; margin-top: 2px; }
  .header-stats { display: flex; gap: 32px; }
  .hstat { text-align: center; }
  .hstat-val { font-size: 22px; font-weight: 700; color: #C9922A; }
  .hstat-lbl { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }

  #layout { display: flex; gap: 0; height: calc(100vh - 70px); overflow: hidden; }

  #map-area {
    flex: 1;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #map-container {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }

  #map-container svg {
    width: 100%;
    height: 100%;
  }

  #sidebar {
    width: 280px;
    border-left: 1px solid #e5e5e5;
    padding: 20px;
    background: #fafafa;
    overflow-y: auto;
  }

  #sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    margin-bottom: 12px;
    margin-top: 20px;
  }
  #sidebar h3:first-child { margin-top: 0; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    transition: background 0.1s;
  }
  .legend-item:hover { background: #f0f0f0; }
  .legend-dot {
    width: 14px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .legend-votes { margin-left: auto; font-weight: 600; font-size: 13px; color: #C9922A; }

  .top-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #eee;
    font-size: 12px;
  }
  .top-rank { color: #bbb; width: 16px; font-size: 11px; }
  .top-name { flex: 1; color: #333; }
  .top-votes { font-weight: 600; color: #C9922A; }

  /* MAP SVG */
  #map-svg {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
  }

  path.mun {
    stroke: rgba(0,0,0,0.25);
    stroke-width: 0.4;
    cursor: pointer;
    transition: filter 0.15s;
  }
  path.mun:hover { filter: brightness(0.85); stroke-width: 1.2; stroke: #333; }

  .mun-label { pointer-events: none; }
  .mun-name { font-size: 7px; font-weight: 600; fill: rgba(0,0,0,0.75); }
  .mun-votes { font-size: 6.5px; font-weight: 700; fill: #7a3a00; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #fff;
    border: 1.5px solid #C9922A;
    border-radius: 8px;
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    z-index: 1000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 180px;
  }
  #tooltip.show { opacity: 1; }
  .tt-region { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #999; margin-bottom: 4px; }
  .tt-name { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 6px; }
  .tt-votes { font-size: 22px; font-weight: 700; color: #C9922A; }
  .tt-pct { font-size: 12px; color: #888; margin-top: 2px; }

  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 400px;
    gap: 16px;
    color: #666;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #eee;
    border-top-color: #C9922A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #search-input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    margin-bottom: 12px;
  }
  #search-input:focus { border-color: #C9922A; }

  .meta-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .meta-card:hover { border-color: #C9922A; }
  .meta-card.active { border-color: #C9922A; background: #fffbf5; }
  .meta-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meta-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
  .meta-name { font-size: 12px; font-weight: 600; color: #333; flex: 1; }
  .meta-pct { font-size: 11px; color: #C9922A; font-weight: 700; }
  .meta-bar-bg { background: #f0f0f0; border-radius: 4px; height: 6px; margin-bottom: 5px; }
  .meta-bar-fill { height: 6px; border-radius: 4px; background: #C9922A; }
  .meta-bar-meta { height: 6px; border-radius: 4px; background: #e8e8e8; position: relative; margin-top: 2px; }
  .meta-bar-meta-fill { height: 6px; border-radius: 4px; background: #27AE60; }
  .meta-numbers { display: flex; justify-content: space-between; font-size: 10px; color: #888; }
  .meta-numbers span { color: #333; font-weight: 600; }

  .meta-summary {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ms-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #999; }
  .ms-val { font-size: 16px; font-weight: 700; color: #C9922A; }
  .ms-val.green { color: #27AE60; }

  .layer-switcher {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .layer-btn {
    background: #fff;
    border: 1.5px solid #ddd;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #555;
    transition: all 0.15s;
  }
  .layer-btn:hover { border-color: #C9922A; color: #C9922A; }
  .layer-btn.active { background: #C9922A; border-color: #C9922A; color: #fff; }
  .layer-btn.active.green { background: #27AE60; border-color: #27AE60; }
  .layer-btn.active.red { background: #E74C3C; border-color: #E74C3C; }

  .color-scale {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #888;
    margin-bottom: 4px;
  }
  .scale-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
  }
</style>

</div>

for (const [region, cities] of Object.entries(REGIONS_DATA)) {
  for (const city of cities) REGION_MAP[normalize(city)] = region;
}

// ── HELPERS ────────────────────────────────────────────────────────────────────
function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').trim();
}

function getVotes(name) {
  const n = normalize(name);
  for (const [k,v] of Object.entries(VOTES)) { if (normalize(k)===n) return v; }
  for (const [k,v] of Object.entries(VOTES)) { if (normalize(k).includes(n)||n.includes(normalize(k))) return v; }
  return 0;
}

function getRegion(name) {
  const r = REGION_MAP[normalize(name)];
  if (!r) console.warn('SEM REGIÃO:', name, '| norm:', normalize(name));
  return r || null;
}

function getColor(name) {
  const r = getRegion(name);
  return r ? REGION_COLORS[r] : '#cccccc';
}

function lighten(hex, pct) {
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255, (n>>16) + pct);
  const g = Math.min(255, ((n>>8)&0xff) + pct);
  const b = Math.min(255, (n&0xff) + pct);
  return `rgb(${r},${g},${b})`;
}

const TOTAL = 33455;

// ── META 2026 ──────────────────────────────────────────────────────────────────
// Mapping briefing regions to our map regions
const META_2026 = {
  "LESTE":        { label: "Salvador + RMS",            meta: 45000 },
  "SUL":          { label: "Sul / Extremo-Sul",         meta: 25000 },
  "EXTREMO-SUL":  { label: "Extremo-Sul",               meta: 10000 },
  "SUDOESTE":     { label: "Sudoeste (V. Conquista)",   meta: 8000  },
  "CENTRO-LESTE": { label: "Centro-Leste (Feira)",      meta: 15000 },
  "OESTE":        { label: "Oeste (Barreiras)",         meta: 5000  },
  "CENTRO-NORTE": { label: "Centro-Norte",              meta: 4000  },
  "NORTE":        { label: "Norte",                     meta: 5000  },
  "NORDESTE":     { label: "Nordeste",                  meta: 3000  },
};

const metaEl = document.getElementById('meta-list');
for (const [region, color] of Object.entries(REGION_COLORS)) {
  const cities = REGIONS_DATA[region] || [];
  const votos2022 = cities.reduce((s,c) => s + (VOTES[c] || 0), 0);
  const { label, meta } = META_2026[region] || { label: region, meta: 0 };
  const pct2022 = Math.min(100, (votos2022 / meta) * 100);
  const crescimento = meta > 0 ? (((meta - votos2022) / votos2022) * 100).toFixed(0) : 0;

  metaEl.innerHTML += `
    <div class="meta-card" onclick="filterRegion('${region}')" id="card-${region}">
      <div class="meta-top">
        <div class="meta-dot" style="background:${color}"></div>
        <span class="meta-name">${label}</span>
        <span class="meta-pct">+${crescimento}%</span>
      </div>
      <div class="meta-bar-bg">
        <div class="meta-bar-fill" style="width:${pct2022.toFixed(1)}%"></div>
      </div>
      <div class="meta-numbers">
        <span>2022: <span>${votos2022.toLocaleString('pt-BR')}</span></span>
        <span>Meta: <span style="color:#27AE60">${meta.toLocaleString('pt-BR')}</span></span>
      </div>
    </div>`;
}

// ── SIDEBAR: Top 20 ────────────────────────────────────────────────────────────
const top20 = Object.entries(VOTES).sort((a,b)=>b[1]-a[1]).slice(0,20);
document.getElementById('top-list').innerHTML = top20.map(([name,votes],i)=>`
  <div class="top-item">
    <span class="top-rank">${i+1}</span>

// ── TOOLTIP ────────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTT(e, name, votes, region) {
  document.getElementById('tt-region').textContent = region || '—';
  document.getElementById('tt-name').textContent = name;
  document.getElementById('tt-votes').textContent = votes > 0 ? votes.toLocaleString('pt-BR') + ' votos' : 'Sem votos';
  document.getElementById('tt-pct').textContent = votes > 0 ? ((votes/TOTAL)*100).toFixed(2)+'% do total' : '';
  tooltip.classList.add('show');
  moveTT(e);
}
function moveTT(e) {
  let x = e.clientX+14, y = e.clientY+14;
  if (x+200>window.innerWidth) x = e.clientX-214;
  if (y+100>window.innerHeight) y = e.clientY-114;
  tooltip.style.left = x+'px'; tooltip.style.top = y+'px';
}
document.addEventListener('mousemove', e => { if(tooltip.classList.contains('show')) moveTT(e); });

// ── MAP LOADING ────────────────────────────────────────────────────────────────
const GEOJSON_URL = 'https://cdn.jsdelivr.net/gh/tbrugz/geodata-br@master/geojson/geojs-29-mun.json';
let svgEl, projection, pathGen, currentZoom = 1;
let allFeatures = [];

async function loadMap() {
  try {
    const res = await fetch(GEOJSON_URL);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const geojson = await res.json();

    document.getElementById('loading').remove();

    const W = 1100, H = 1180;
    svgEl = d3.select('#map-container').append('svg')
      .attr('id','map-svg')
      .attr('viewBox',`0 0 ${W} ${H}`)
      .attr('width','100%')
      .attr('height','100%')
      .style('display','block');

    const g = svgEl.append('g').attr('id','map-g');

    projection = d3.geoMercator().fitSize([W, H], geojson);
    pathGen = d3.geoPath().projection(projection);
    allFeatures = geojson.features;

    // Draw municipalities
    g.selectAll('path')
      .data(geojson.features)
      .join('path')
      .attr('class','mun')
      .attr('d', pathGen)
      .attr('fill', d => getColor(getPropName(d)))
      .attr('fill-opacity', d => {
        const v = getVotes(getPropName(d));
        return v > 0 ? 0.75 + Math.min(0.25, v/5720*0.25) : 0.3;
      })
      .on('mouseover', function(event, d) {
        const name = getPropName(d);
        const votes = getVotes(name);
        const region = getRegion(name);
        showTT(event, name, votes, region);
        d3.select(this).attr('stroke','#222').attr('stroke-width',1.2).raise();
      })
      .on('mouseleave', function(event, d) {
        tooltip.classList.remove('show');
        d3.select(this).attr('stroke','rgba(0,0,0,0.25)').attr('stroke-width',0.4);
      });

    // Draw labels
    const labelG = g.append('g').attr('id','labels');
    geojson.features.forEach(d => {
      const name = getPropName(d);
      const votes = getVotes(name);
      const centroid = pathGen.centroid(d);
      if (!centroid || isNaN(centroid[0])) return;

      // Shorten name for display
      const shortName = name.length > 12 ? name.substring(0,11)+'.' : name;

      labelG.append('text')
        .attr('class','mun-name')
        .attr('x', centroid[0])
        .attr('y', centroid[1] - 1.5)
        .attr('text-anchor','middle')
        .attr('dominant-baseline','auto')
        .text(shortName);

      if (votes > 0) {
        labelG.append('text')
          .attr('class','mun-votes')
          .attr('x', centroid[0])
          .attr('y', centroid[1] + 4)
          .attr('text-anchor','middle')
          .attr('dominant-baseline','auto')
          .text(votes.toLocaleString('pt-BR'));
      }
    });

    // Zoom/pan
    const zoom = d3.zoom()
      .scaleExtent([1, 12])
      .on('zoom', e => {
        g.attr('transform', e.transform);
        const scale = e.transform.k;
        // Scale labels inversely so they stay readable
        const fontSize = Math.max(4, Math.min(12, 7 / scale));
        const voteSize = Math.max(3, Math.min(11, 6.5 / scale));
        g.selectAll('.mun-name').attr('font-size', fontSize);
        g.selectAll('.mun-votes').attr('font-size', voteSize);
        g.selectAll('.mun').attr('stroke-width', 0.4 / scale);
      });
    svgEl.call(zoom);
    window._zoom = zoom;
    window._svg = svgEl;
    patchMouseover();

  } catch(err) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:#666;padding:40px">
        <div style="font-size:28px;margin-bottom:12px">⚠️</div>
        <div style="font-weight:600;margin-bottom:8px">Erro ao carregar o mapa</div>
        <div style="font-size:13px;margin-bottom:16px">${err.message}</div>
        <div style="font-size:12px;background:#f5f5f5;padding:12px;border-radius:6px;text-align:left;max-width:400px">
          <strong>Solução:</strong> Sirva o arquivo via servidor local:<br><br>
          <code>python -m http.server 8080</code><br>
          Depois acesse: <code>localhost:8080/mapa_bahia_final.html</code><br><br>
          Ou use a extensão <strong>Live Server</strong> no VS Code.
        </div>
      </div>`;
  }
}

function getPropName(d) {
  const p = d.properties;
  return p.name || p.NOME || p.NM_MUNICIP || p.nome || '';
}

// ── ZOOM CONTROLS ──────────────────────────────────────────────────────────────
function zoomIn() { if(window._svg && window._zoom) window._svg.transition().call(window._zoom.scaleBy, 1.5); }
function zoomOut() { if(window._svg && window._zoom) window._svg.transition().call(window._zoom.scaleBy, 0.67); }
function resetZoom() { if(window._svg && window._zoom) window._svg.transition().call(window._zoom.transform, d3.zoomIdentity); }

// ── LAYER SYSTEM ───────────────────────────────────────────────────────────────
const META_PER_REGION = {
  "LESTE": 45000, "SUL": 25000, "EXTREMO-SUL": 10000,
  "SUDOESTE": 8000, "CENTRO-LESTE": 15000, "OESTE": 5000,
  "CENTRO-NORTE": 4000, "NORTE": 5000, "NORDESTE": 3000
};

function getRegionTotal2022(region) {
  return (REGIONS_DATA[region]||[]).reduce((s,c)=>s+(VOTES[c]||0),0);
}

function getMunMeta(name) {
  const region = getRegion(name);
  if (!region) return 0;
  const votes2022 = getVotes(name);
  const regionTotal = getRegionTotal2022(region);
  const regionMeta = META_PER_REGION[region] || 0;
  if (regionTotal === 0) return 0;
  return Math.round((votes2022 / regionTotal) * regionMeta);
}

function getMunGrowth(name) {
  const votes2022 = getVotes(name);
  const meta = getMunMeta(name);
  if (votes2022 === 0) return meta;
  return Math.max(0, meta - votes2022);
}

// Color scales
const colorVotos = d3.scaleSequential(d3.interpolate('#f5f0e8','#8A5E10')).domain([0, 5720]);
const colorMeta  = d3.scaleSequential(d3.interpolate('#e8f5e9','#1B5E20')).domain([0, 40000]);
const colorGrowth= d3.scaleSequential(d3.interpolate('#fff3e0','#B71C1C')).domain([0, 35000]);

let currentLayer = 'votos2022';

function getFillForLayer(name, layer) {
  const region = getRegion(name);
  if (!region) return '#cccccc';
  if (layer === 'votos2022') {
    const v = getVotes(name);
    return v > 0 ? colorVotos(v) : '#eeeeee';
  }
  if (layer === 'meta2026') {
    const m = getMunMeta(name);
    return m > 0 ? colorMeta(m) : '#eeeeee';
  }
  if (layer === 'crescimento') {
    const g = getMunGrowth(name);
    return g > 0 ? colorGrowth(g) : '#eeeeee';
  }
  return '#cccccc';
}

function getTooltipExtra(name, layer) {
  if (layer === 'votos2022') return '';
  if (layer === 'meta2026') {
    const m = getMunMeta(name);
    return `<div style="font-size:12px;color:#27AE60;margin-top:4px">Meta 2026: <strong>${m.toLocaleString('pt-BR')}</strong></div>`;
  }
  if (layer === 'crescimento') {
    const v = getVotes(name);
    const m = getMunMeta(name);
    const g = getMunGrowth(name);
    const mult = v > 0 ? (m/v).toFixed(1) : '—';
    return `<div style="font-size:12px;color:#E74C3C;margin-top:4px">Faltam: <strong>${g.toLocaleString('pt-BR')}</strong> votos (${mult}x)</div>`;
  }
  return '';
}

function updateVoteLabel(name, layer) {
  if (layer === 'votos2022') return getVotes(name);
  if (layer === 'meta2026') return getMunMeta(name);
  if (layer === 'crescimento') return getMunGrowth(name);
  return 0;
}

function setLayer(layer) {
  currentLayer = layer;

  // Update button states
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  const idx = ['votos2022','meta2026','crescimento'].indexOf(layer);
  document.querySelectorAll('.layer-btn')[idx].classList.add('active');

  // Update color scale bar
  const scaleBar = document.getElementById('scale-bar');
  const scaleLabel = document.getElementById('scale-label');
  const scaleMin = document.getElementById('scale-min');
  const scaleMax = document.getElementById('scale-max');
  if (layer === 'votos2022') {
    scaleBar.style.background = 'linear-gradient(to right, #f5f0e8, #8A5E10)';
    scaleMin.textContent = '0'; scaleMax.textContent = '5.720'; scaleLabel.textContent = 'votos 2022';
  } else if (layer === 'meta2026') {
    scaleBar.style.background = 'linear-gradient(to right, #e8f5e9, #1B5E20)';
    scaleMin.textContent = '0'; scaleMax.textContent = '40.000'; scaleLabel.textContent = 'meta 2026';
  } else {
    scaleBar.style.background = 'linear-gradient(to right, #fff3e0, #B71C1C)';
    scaleMin.textContent = '0'; scaleMax.textContent = '35.000'; scaleLabel.textContent = 'votos a conquistar';
  }

  // Update map fills
  d3.selectAll('path.mun').attr('fill', d => getFillForLayer(getPropName(d), layer));

  // Update vote labels
  d3.selectAll('.mun-votes').text(d => {
    if (!d) return '';
    const name = getPropName(d);
    const val = updateVoteLabel(name, layer);
    return val > 0 ? val.toLocaleString('pt-BR') : '';
  });
}

// ── OVERRIDE TOOLTIP to show layer-aware data ──────────────────────────────────
// Patch mouseover after map loads to include extra layer info
function patchMouseover() {
  d3.selectAll('path.mun')
    .on('mouseover', function(event, d) {
      const name = getPropName(d);
      const votes = getVotes(name);
      const region = getRegion(name);
      const extra = getTooltipExtra(name, currentLayer);
      document.getElementById('tt-region').textContent = region || '—';
      document.getElementById('tt-name').textContent = name;
      document.getElementById('tt-votes').textContent = votes > 0 ? votes.toLocaleString('pt-BR') + ' votos (2022)' : 'Sem votos';
      document.getElementById('tt-pct').textContent = votes > 0 ? ((votes/TOTAL)*100).toFixed(2)+'% do total' : '';
      document.getElementById('tt-extra').innerHTML = extra;
      tooltip.classList.add('show');
      moveTT(event);
      d3.select(this).attr('stroke','#222').attr('stroke-width',1.2).raise();
    })
    .on('mouseleave', function() {
      tooltip.classList.remove('show');
      d3.select(this).attr('stroke','rgba(0,0,0,0.25)').attr('stroke-width',0.4);
    });
}

// ── SEARCH ─────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function() {
  const q = normalize(this.value);
  if (!q) { d3.selectAll('path.mun').attr('opacity',1); return; }
  d3.selectAll('path.mun').attr('opacity', d => normalize(getPropName(d)).includes(q) ? 1 : 0.15);
});

// ── REGION FILTER ──────────────────────────────────────────────────────────────
let activeRegion = null;
function filterRegion(region) {
  if (activeRegion === region) {
    activeRegion = null;
    d3.selectAll('path.mun').attr('opacity',1);
    document.querySelectorAll('.meta-card').forEach(c=>c.classList.remove('active'));
  } else {
    activeRegion = region;
    d3.selectAll('path.mun').attr('opacity', d => getRegion(getPropName(d)) === region ? 1 : 0.12);
    document.querySelectorAll('.meta-card').forEach(c=>c.classList.remove('active'));
    document.getElementById('card-'+region)?.classList.add('active');
  }
}

loadMap();
</script>
